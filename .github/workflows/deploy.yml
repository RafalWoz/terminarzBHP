name: Deploy do LH.pl BHP

on:
  push:
    branches:
      - main
    paths-ignore:
      - public/images/blog/**

# Keep stale builds from overwriting a newer production release.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie kodu z repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            terminybhp-portal/package-lock.json

      - name: Budowanie aplikacji serwisowej
        run: |
          npm ci
          npm run build

      - name: Generowanie kolejnosci publikacji artykulow
        working-directory: terminybhp-portal
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const postsDir = path.join('data', 'posts');
          const order = {};
          for (const fileName of fs.readdirSync(postsDir).filter((name) => name.endsWith('.json'))) {
            const slug = fileName.replace(/\.json$/, '');
            order[slug] = execFileSync('git', ['log', '-1', '--format=%cI', '--', path.join('terminybhp-portal', postsDir, fileName)], { cwd: '..', encoding: 'utf8' }).trim();
          }
          fs.mkdirSync('.generated', { recursive: true });
          fs.writeFileSync(path.join('.generated', 'posts-order.json'), JSON.stringify(order));
          NODE

      - name: Budowanie publicznego portalu i bloga
        working-directory: terminybhp-portal
        run: |
          mkdir -p public/images/blog
          cp -R ../public/images/blog/. public/images/blog/
          npm ci
          npm run build

      - name: Wysylka publicznego portalu i bloga przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./terminybhp-portal/out/
          server-dir: /public_html/terminybhp/

      - name: Wysylka aplikacji serwisowej przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/terminybhp/serwis/
